<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Voice cloning protection through human perception</title><desc id="d">A recording passes through a protector. The research goal is to preserve the voice for people while changing the identity heard after cloning.</desc><rect width="1200" height="630" fill="#fcfcfa"/><text x="65" y="64" font-family="Arial,sans-serif" font-size="16" letter-spacing="3" fill="#087c82">CLONEBLOCK-RT / YUXUAN LIU</text><text x="65" y="150" font-family="Georgia,serif" font-size="56" fill="#132c42">Rethinking voice cloning protection.</text><text x="65" y="205" font-family="Georgia,serif" font-size="39" fill="#087c82">Through human perception.</text><path d="M135 345H600M600 345L840 315M600 345L840 465" fill="none" stroke="#a8babf" stroke-width="2"/><circle cx="135" cy="345" r="48" fill="#fcfcfa" stroke="#132c42" stroke-width="2"/><text x="135" y="358" text-anchor="middle" font-family="Georgia,serif" font-size="40" fill="#132c42">x</text><rect x="318" y="297" width="96" height="96" rx="5" fill="#087c82"/><text x="366" y="358" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="40" fill="#fff">P</text><circle cx="600" cy="345" r="48" fill="#fcfcfa" stroke="#087c82" stroke-width="2"/><text x="600" y="358" text-anchor="middle" font-family="Georgia,serif" font-size="40" fill="#087c82">x′</text><text x="135" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#50616d">Original voice</text><text x="366" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#50616d">Protector</text><text x="600" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#50616d">Protected WAV</text><rect x="820" y="270" width="315" height="90" rx="4" fill="#e9f3f1"/><text x="844" y="306" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#087c82">For people</text><text x="844" y="335" font-family="Arial,sans-serif" font-size="18" fill="#132c42">Same person. Still usable.</text><rect x="820" y="430" width="315" height="90" rx="4" fill="#f5eae6"/><text x="844" y="466" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#b94d38">After cloning</text><text x="844" y="495" font-family="Arial,sans-serif" font-size="18" fill="#132c42">A different voice identity.</text><path d="M65 557H1135" stroke="#d8dedf"/><text x="65" y="595" font-family="Arial,sans-serif" font-size="16" fill="#50616d">The research goal — test the complete chain, not just a speaker score.</text></svg>
