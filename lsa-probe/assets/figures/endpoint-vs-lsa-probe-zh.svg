<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">终点重建证据与 LSA-Probe 对比</title>
  <desc id="desc">概念对比图：终点重建证据高度重叠，而 LSA-Probe 比较成员与非成员达到同一感知退化阈值所需的最小归一化扰动预算。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1l10 5-10 5z" fill="#175C78"/></marker>
    <linearGradient id="spec" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#175C78"/><stop offset=".52" stop-color="#0F766E"/><stop offset="1" stop-color="#D97706"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0F172A" flood-opacity=".06"/></filter>
    <g id="spectrogram"><rect width="154" height="62" rx="10" fill="#E8F1F5" stroke="#CBD5E1" stroke-width="2"/><g fill="url(#spec)"><rect x="14" y="34" width="9" height="18"/><rect x="29" y="16" width="9" height="36"/><rect x="44" y="25" width="9" height="27"/><rect x="59" y="10" width="9" height="42"/><rect x="74" y="22" width="9" height="30"/><rect x="89" y="14" width="9" height="38"/><rect x="104" y="29" width="9" height="23"/><rect x="119" y="18" width="9" height="34"/><rect x="134" y="37" width="9" height="15"/></g></g>
  </defs>
  <rect width="1600" height="900" fill="#F6F8FB"/>
  <rect x="32" y="26" width="1536" height="848" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="80" y="78" fill="#175C78" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="750" letter-spacing="2">概念对比</text>
  <text x="1520" y="78" text-anchor="end" fill="#64748B" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="22">并非实测的单样本数据</text>
  <rect x="70" y="112" width="1460" height="302" rx="22" fill="#FFFFFF" stroke="#D9E1EA" stroke-width="2" filter="url(#soft)"/>
  <text x="105" y="160" fill="#0F172A" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="760">终点重建误差</text>
  <text x="1494" y="160" text-anchor="end" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="650">D(x₀, x̂₀)</text>
  <line x1="105" y1="182" x2="1494" y2="182" stroke="#E2E8F0" stroke-width="2"/>
  <text x="110" y="249" fill="#0F766E" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="760">成员</text>
  <text x="110" y="345" fill="#A45B08" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="760">非成员</text>
  <use href="#spectrogram" x="282" y="208"/><use href="#spectrogram" x="282" y="304"/>
  <path d="M462 239h110M462 335h110" fill="none" stroke="#175C78" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="620" cy="239" r="38" fill="#EEF4F7" stroke="#175C78" stroke-width="3"/><circle cx="620" cy="335" r="38" fill="#EEF4F7" stroke="#175C78" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="620" y="248" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="25">x<tspan baseline-shift="sub" font-size="18">t</tspan></text><text x="620" y="344" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="25">x<tspan baseline-shift="sub" font-size="18">t</tspan></text>
  <rect x="716" y="205" width="170" height="164" rx="18" fill="#E8F1F5" stroke="#B7CBD5" stroke-width="2"/>
  <text x="801" y="276" text-anchor="middle" fill="#175C78" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="760">R<tspan baseline-shift="sub" font-size="20">t</tspan></text>
  <text x="801" y="316" text-anchor="middle" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="22">反向过程</text>
  <path d="M662 239h48M662 335h48M892 239h112M892 335h112" fill="none" stroke="#175C78" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1028 239c18-29 35 28 53 0s35 28 53 0 35 28 53 0" fill="none" stroke="#0F766E" stroke-width="5"/><path d="M1028 335c18-29 35 28 53 0s35 28 53 0 35 28 53 0" fill="none" stroke="#D97706" stroke-width="5"/>
  <g transform="translate(1270 205)"><circle cx="76" cy="81" r="62" fill="#0F766E" fill-opacity=".17" stroke="#0F766E" stroke-width="3"/><circle cx="124" cy="81" r="62" fill="#D97706" fill-opacity=".17" stroke="#D97706" stroke-width="3" stroke-dasharray="10 8"/><text x="100" y="177" text-anchor="middle" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">终点证据高度重叠</text></g>
  <rect x="70" y="442" width="1460" height="380" rx="22" fill="#F8FBFC" stroke="#B7CBD5" stroke-width="2" filter="url(#soft)"/>
  <text x="105" y="493" fill="#0F172A" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="760">LSA-Probe · 达到 <tspan font-family="Times New Roman, STIXGeneral, serif">&#x03C4;</tspan> 所需的最小代价</text>
  <text x="1494" y="493" text-anchor="end" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="650">δ<tspan baseline-shift="sub" font-size="18">t</tspan> = σ<tspan baseline-shift="sub" font-size="18">t</tspan> δ̃</text>
  <line x1="105" y1="515" x2="1494" y2="515" stroke="#D9E1EA" stroke-width="2"/>
  <text x="110" y="606" fill="#0F766E" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="760">成员 x<tspan baseline-shift="sub" font-size="18">t</tspan></text>
  <text x="110" y="723" fill="#A45B08" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="760">非成员 x<tspan baseline-shift="sub" font-size="18">t</tspan></text>
  <line x1="330" y1="594" x2="850" y2="594" stroke="#DDE7EC" stroke-width="18" stroke-linecap="round"/><line x1="330" y1="711" x2="850" y2="711" stroke="#DDE7EC" stroke-width="18" stroke-linecap="round"/>
  <line x1="330" y1="594" x2="800" y2="594" stroke="#0F766E" stroke-width="18" stroke-linecap="round"/><line x1="330" y1="711" x2="575" y2="711" stroke="#D97706" stroke-width="18" stroke-linecap="round"/>
  <circle cx="800" cy="594" r="13" fill="#FFFFFF" stroke="#0F766E" stroke-width="5"/><circle cx="575" cy="711" r="13" fill="#FFFFFF" stroke="#D97706" stroke-width="5" stroke-dasharray="5 4"/>
  <text x="800" y="559" text-anchor="middle" fill="#0F766E" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="730">较大的 C<tspan baseline-shift="sub" font-size="16">adv</tspan></text>
  <text x="575" y="676" text-anchor="middle" fill="#A45B08" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="730">较小的 C<tspan baseline-shift="sub" font-size="16">adv</tspan></text>
  <rect x="900" y="548" width="230" height="216" rx="18" fill="#FFFFFF" stroke="#E45756" stroke-width="3"/>
  <text x="1015" y="588" text-anchor="middle" fill="#E45756" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="760">相同目标</text>
  <line x1="932" y1="654" x2="1098" y2="654" stroke="#E45756" stroke-width="3" stroke-dasharray="10 8"/><text x="1015" y="642" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="760">D = <tspan font-family="Times New Roman, STIXGeneral, serif">&#x03C4;</tspan></text><path d="M940 704c17-29 34 28 51 0s34 28 51 0 34 28 51 0" fill="none" stroke="#175C78" stroke-width="5"/>
  <rect x="1170" y="548" width="324" height="216" rx="18" fill="#E8F1F5" stroke="#B7CBD5" stroke-width="2"/>
  <text x="1332" y="612" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="760">C<tspan baseline-shift="sub" font-size="18">adv</tspan>(member)</text><text x="1332" y="655" text-anchor="middle" fill="#175C78" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">&gt;</text><text x="1332" y="699" text-anchor="middle" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="760">C<tspan baseline-shift="sub" font-size="18">adv</tspan>(non-member)</text>
  <text x="1332" y="738" text-anchor="middle" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="650">代价越高 → 越偏向成员</text>
</svg>
