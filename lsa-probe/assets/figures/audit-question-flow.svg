<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title" data-i18n="a11y.audit_flow_title">LSA-Probe audit flow</title>
  <desc id="desc" data-i18n="a11y.audit_flow">Candidate audio and an audited music diffusion model are inputs to an authorized probe that produces a continuous statistical membership evidence score.</desc>
  <defs>
    <linearGradient id="spectral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#175c78"/>
      <stop offset=".55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="noise" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbe8ee"/>
      <stop offset="1" stop-color="#a7b6c5"/>
    </linearGradient>
    <linearGradient id="evidence" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset=".5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#175c78"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172033" flood-opacity=".08"/>
    </filter>
    <pattern id="noisePattern" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="2" fill="#748096" opacity=".5"/>
      <circle cx="16" cy="13" r="2.4" fill="#175c78" opacity=".35"/>
      <path d="M2 18l6-5 5 4 7-7" fill="none" stroke="#94a3b8" stroke-width="2" opacity=".5"/>
    </pattern>
  </defs>
  <rect x="8" y="8" width="1584" height="604" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="54" y="128" width="340" height="350" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <rect x="78" y="158" width="292" height="126" rx="15" fill="#e8f1f5"/>
  <path d="M92 222c18-70 34 70 52 0s34 70 52 0 34 70 52 0 34 70 52 0 34 70 52 0" fill="none" stroke="#175c78" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(78 302)">
    <rect width="292" height="94" rx="13" fill="#f1f5f9"/>
    <g fill="url(#spectral)" opacity=".86">
      <rect x="16" y="44" width="12" height="35" rx="3"/><rect x="35" y="24" width="12" height="55" rx="3"/>
      <rect x="54" y="50" width="12" height="29" rx="3"/><rect x="73" y="12" width="12" height="67" rx="3"/>
      <rect x="92" y="32" width="12" height="47" rx="3"/><rect x="111" y="18" width="12" height="61" rx="3"/>
      <rect x="130" y="48" width="12" height="31" rx="3"/><rect x="149" y="27" width="12" height="52" rx="3"/>
      <rect x="168" y="8" width="12" height="71" rx="3"/><rect x="187" y="40" width="12" height="39" rx="3"/>
      <rect x="206" y="21" width="12" height="58" rx="3"/><rect x="225" y="34" width="12" height="45" rx="3"/>
      <rect x="244" y="14" width="12" height="65" rx="3"/><rect x="263" y="45" width="12" height="34" rx="3"/>
    </g>
  </g>
  <text x="224" y="440" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" data-i18n="svg.audit.candidate">Candidate audio</text>

  <text x="432" y="310" text-anchor="middle" fill="#748096" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700">+</text>

  <g filter="url(#shadow)"><rect x="478" y="88" width="500" height="430" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/></g>
  <text x="728" y="137" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" data-i18n="svg.audit.model">Audited diffusion model</text>
  <g transform="translate(520 180)">
    <rect width="126" height="118" rx="14" fill="#e8f1f5" stroke="#b7cbd5"/>
    <path d="M14 59c10-40 20 40 30 0s20 40 30 0 20 40 30 0" fill="none" stroke="#0f766e" stroke-width="4"/>
    <text x="63" y="146" text-anchor="middle" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="22" data-i18n="svg.audit.clean">Clean</text>
  </g>
  <path d="M660 238h74" stroke="#175c78" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="697" y="216" text-anchor="middle" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="22" data-i18n="svg.audit.forward">Forward</text>
  <rect x="752" y="180" width="126" height="118" rx="14" fill="url(#noisePattern)" stroke="#b7cbd5"/>
  <text x="815" y="326" text-anchor="middle" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="22" data-i18n="svg.audit.noisy">Noisy state</text>
  <path d="M892 238h56" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="920" y="216" text-anchor="middle" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="22" data-i18n="svg.audit.reverse">Reverse</text>
  <rect x="685" y="376" width="86" height="74" rx="18" fill="#e8f1f5" stroke="#175c78" stroke-width="2"/>
  <path d="M708 413l13 13 27-31" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="789" cy="390" r="26" fill="none" stroke="#175c78" stroke-width="5"/>
  <path d="M807 409l21 21" stroke="#175c78" stroke-width="6" stroke-linecap="round"/>
  <text x="728" y="488" text-anchor="middle" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="22" data-i18n="svg.audit.inspected">Model access is inspected</text>

  <path d="M394 303C500 303 480 553 1035 405" fill="none" stroke="#175c78" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M978 303C1035 303 1010 340 1060 354" fill="none" stroke="#175c78" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="1040" y="214" width="250" height="214" rx="28" fill="#e8f1f5" stroke="#175c78" stroke-width="2"/></g>
  <circle cx="1165" cy="285" r="39" fill="#fff" stroke="#175c78" stroke-width="3"/>
  <path d="M1149 286l12 12 23-27" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1165" y="360" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" data-i18n="svg.audit.probe">Authorized probe</text>
  <text x="1165" y="392" text-anchor="middle" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="22">C<tspan baseline-shift="sub" font-size="16">adv</tspan>(x)</text>

  <path d="M1290 321h72" stroke="#175c78" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="1368" y="132" width="178" height="374" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/></g>
  <path d="M1411 206h92v62c0 54-37 88-46 94-9-6-46-40-46-94z" fill="#e8f1f5" stroke="#175c78" stroke-width="3"/>
  <path d="M1435 263l16 17 30-42" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1457" y="401" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700"><tspan x="1457" data-i18n="svg.audit.evidence_line1">Membership</tspan><tspan x="1457" dy="31" data-i18n="svg.audit.evidence_line2">evidence</tspan></text>

  <rect x="1000" y="545" width="546" height="13" rx="7" fill="url(#evidence)"/>
  <path d="M1273 526v50" stroke="#0f172a" stroke-width="3"/>
  <text x="1000" y="596" fill="#9a6413" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="650" data-i18n="svg.audit.nonmember_like">More non-member-like</text>
  <text x="1546" y="596" text-anchor="end" fill="#0f766e" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="650" data-i18n="svg.audit.member_like">More member-like</text>
</svg>
