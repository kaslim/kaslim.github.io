<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title" data-i18n="a11y.comparison_title">Endpoint reconstruction loss compared with LSA-Probe</title>
  <desc id="desc" data-i18n="a11y.comparison_alt">Conceptual comparison showing overlapping endpoint evidence but different minimum normalized perturbation costs for member and non-member candidates at the same degradation threshold.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="10" refY="6" orient="auto" viewBox="0 0 12 12"><path d="M1 1l10 5-10 5z" fill="#175c78"/></marker>
    <linearGradient id="spectral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#175c78"/><stop offset=".52" stop-color="#0f766e"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <pattern id="noise" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="1.7" fill="#64748b" opacity=".45"/><circle cx="13" cy="11" r="2" fill="#175c78" opacity=".3"/><path d="M1 15l5-4 4 3 6-6" fill="none" stroke="#94a3b8" stroke-width="1.6" opacity=".55"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity=".07"/></filter>
  </defs>
  <rect x="8" y="8" width="1584" height="1084" rx="30" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="76" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="750" data-i18n="svg.compare.endpoint_title">Endpoint reconstruction loss</text>
  <text x="1488" y="76" text-anchor="end" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="24">D(x₀, x̂₀)</text>
  <line x1="72" y1="103" x2="1528" y2="103" stroke="#d9e1ea" stroke-width="2"/>

  <g font-family="Inter,Arial,sans-serif">
    <text x="82" y="178" fill="#0f766e" font-size="24" font-weight="700" data-i18n="svg.compare.member_short">Member</text>
    <text x="82" y="355" fill="#9a6413" font-size="24" font-weight="700" data-i18n="svg.compare.nonmember_short">Non-member</text>
  </g>
  <g transform="translate(300 130)">
    <g filter="url(#shadow)"><rect width="218" height="122" rx="16" fill="#e8f1f5" stroke="#cbd5e1"/><rect y="178" width="218" height="122" rx="16" fill="#fff5df" stroke="#e5c986"/></g>
    <g fill="url(#spectral)" opacity=".9">
      <rect x="22" y="61" width="13" height="44"/><rect x="43" y="29" width="13" height="76"/><rect x="64" y="49" width="13" height="56"/><rect x="85" y="19" width="13" height="86"/><rect x="106" y="42" width="13" height="63"/><rect x="127" y="30" width="13" height="75"/><rect x="148" y="54" width="13" height="51"/><rect x="169" y="25" width="13" height="80"/><rect x="190" y="65" width="13" height="40"/>
      <rect x="22" y="239" width="13" height="44"/><rect x="43" y="207" width="13" height="76"/><rect x="64" y="227" width="13" height="56"/><rect x="85" y="197" width="13" height="86"/><rect x="106" y="220" width="13" height="63"/><rect x="127" y="208" width="13" height="75"/><rect x="148" y="232" width="13" height="51"/><rect x="169" y="203" width="13" height="80"/><rect x="190" y="243" width="13" height="40"/>
    </g>
  </g>
