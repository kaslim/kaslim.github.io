  <path d="M380 682h420" stroke="#0f766e" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M380 862h230" stroke="#d97706" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="590" y="653" text-anchor="middle" fill="#0f766e" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" data-i18n="svg.compare.larger_budget">Larger minimum budget</text>
  <text x="495" y="833" text-anchor="middle" fill="#9a6413" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" data-i18n="svg.compare.smaller_budget">Smaller minimum budget</text>
  <text x="590" y="735" text-anchor="middle" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="22">δ<tspan baseline-shift="sub" font-size="16">t</tspan><tspan> = σ</tspan><tspan baseline-shift="sub" font-size="16">t</tspan><tspan> δ&#x0303;</tspan></text><text x="495" y="915" text-anchor="middle" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="22">δ<tspan baseline-shift="sub" font-size="16">t</tspan><tspan> = σ</tspan><tspan baseline-shift="sub" font-size="16">t</tspan><tspan> δ&#x0303;</tspan></text>
