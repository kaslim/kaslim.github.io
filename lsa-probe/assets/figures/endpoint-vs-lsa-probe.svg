  <path d="M878 682c55-54 84 58 137 0M878 862c55-54 84 58 137 0" fill="none" stroke="#175c78" stroke-width="4"/>
  <text x="948" y="770" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700"><tspan>R</tspan><tspan baseline-shift="sub" font-size="18">t</tspan><tspan>(·;θ)</tspan></text>
  <text x="948" y="807" text-anchor="middle" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="21" data-i18n="svg.compare.reverse_process">Reverse process</text>
