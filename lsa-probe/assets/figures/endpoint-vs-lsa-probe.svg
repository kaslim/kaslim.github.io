  <rect x="1225" y="635" width="295" height="278" rx="20" fill="#fff" stroke="#e45756" stroke-width="3"/>
  <line x1="1254" y1="770" x2="1492" y2="770" stroke="#e45756" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1373" y="730" text-anchor="middle" fill="#e45756" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" data-i18n="svg.compare.same_tau">Same fixed threshold τ</text>
  <path d="M1260 682c22-36 43 34 64 0s43 34 64 0 43 34 64 0" fill="none" stroke="#0f766e" stroke-width="5"/><path d="M1260 862c22-36 43 34 64 0s43 34 64 0 43 34 64 0" fill="none" stroke="#d97706" stroke-width="5"/>
  <rect x="660" y="963" width="880" height="64" rx="16" fill="#e8f1f5"/>
  <text x="1100" y="1005" text-anchor="middle" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="750">C<tspan baseline-shift="sub" font-size="20">adv</tspan>(member) &gt; C<tspan baseline-shift="sub" font-size="20">adv</tspan>(non-member) · <tspan data-i18n="svg.compare.member_like">Higher cost → more member-like</tspan></text>
</svg>
