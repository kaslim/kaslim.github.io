  <text x="1488" y="575" text-anchor="end" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="24">C<tspan baseline-shift="sub" font-size="18">adv</tspan>(x₀;t,τ)</text>
  <line x1="72" y1="603" x2="1528" y2="603" stroke="#d9e1ea" stroke-width="2"/>
  <text x="82" y="695" fill="#0f766e" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan data-i18n="svg.compare.member_short">Member</tspan><tspan dx="12">x</tspan><tspan baseline-shift="sub" font-size="18">t</tspan></text>
  <text x="82" y="875" fill="#9a6413" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700"><tspan data-i18n="svg.compare.nonmember_short">Non-member</tspan><tspan dx="12">x</tspan><tspan baseline-shift="sub" font-size="18">t</tspan></text>
